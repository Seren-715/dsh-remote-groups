# Install after the standard upstream bundles. Keep their packages/data installed,
# but suspend their runtime entries while this enhanced distribution is active.
# Name assertions prevent disabling unrelated plugins that happen to share an id.
- id: ds-harness-remote
  name: ds-harness-remote
  disabled: true
- id: ds-harness-remote-tui
  name: ds-harness-remote
  disabled: true
- id: bot
  name: ds-bot
  disabled: true
- id: web-search-auto
  name: ds-bot/web-search
  disabled: true
- insert:
    - id: groups-companion-remote
      name: ../remote/index.js
      inject: [webServer]
      disabled: !!js >-
        [...ctx.loader.entries()].some(entry =>
          (entry.options.id === 'dsh-tui' || entry.options.name === '@deepseek-harness-tui/dsh-tui')
          && !entry.disabled
        )
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
        codex:
          enabled: true
          binary: codex
    - id: groups-companion-remote-tui
      name: ../remote/index.js
      inject: [settings, typertGateway, commands, tuiCommandTrees, tuiScenes]
      disabled: !!js >-
        ![...ctx.loader.entries()].some(entry =>
          (entry.options.id === 'dsh-tui' || entry.options.name === '@deepseek-harness-tui/dsh-tui')
          && !entry.disabled
        )
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
        codex:
          enabled: true
          binary: codex
    - id: groups-companion-bot
      name: ../host/ds-bot/index.js
      config:
        updateCheck: false
    - id: groups-companion-web-search
      name: ../host/ds-bot/web-search.js
- id: web
  config:
    searchProvider: auto
    fetchProvider: http
